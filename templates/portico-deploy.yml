name: Portico Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: portico-deploy-production
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          test -d "@@ASSET_DIR@@"
          tar -czf "$RUNNER_TEMP/site.tgz" -C "@@ASSET_DIR@@" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-${{ github.sha }}
          path: ${{ runner.temp }}/site.tgz
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: package
    if: github.repository == '@@REPO@@' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PD_AUTO_DEPLOY == 'true')
    runs-on: [self-hosted, linux, x64, '@@RUNNER_LABEL@@']
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-${{ github.sha }}
          path: ${{ runner.temp }}/pd-artifact
      - name: Publish immutable release
        shell: bash
        env:
          PD_SHA: ${{ github.sha }}
          PD_HEALTH_URL: ${{ vars.PD_HEALTH_URL }}
        run: |
          set -euo pipefail
          /usr/bin/python3 /usr/local/libexec/portico-deploy-release.py --project '@@PROJECT@@' --sha "$PD_SHA" --archive "$RUNNER_TEMP/pd-artifact/site.tgz"
          if [[ -z "${PD_HEALTH_URL:-}" ]]; then
            echo 'DEPLOYED, HTTP HEALTH NOT CHECKED: configure PD_HEALTH_URL'
          elif ! curl --fail --silent --show-error --max-time 8 --retry 3 --retry-delay 2 "$PD_HEALTH_URL" >/dev/null; then
            echo 'Healthcheck failed; rolling back.'
            /usr/bin/python3 /usr/local/libexec/portico-deploy-release.py --project '@@PROJECT@@' --rollback
            exit 1
          else
            echo 'DEPLOYED AND HEALTHCHECK PASSED'
          fi
