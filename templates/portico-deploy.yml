name: Portico Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: portico-deploy-production
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build artifact
        shell: bash
        run: |
          set -euo pipefail
          case "@@ARTIFACT_TYPE@@" in
            static)
              test -d "@@ASSET_DIR@@"
              tar -czf "$RUNNER_TEMP/artifact.tgz" -C "@@ASSET_DIR@@" .
              ;;
            python)
              pip install -r requirements.txt
              tar -czf "$RUNNER_TEMP/artifact.tgz" -C "@@APP_DIR@@" . --exclude='__pycache__' --exclude='*.pyc' --exclude='.venv' --exclude='venv' --exclude='*.egg-info' --exclude='build' --exclude='dist'
              ;;
            nodejs)
              npm ci
              npm run build
              tar -czf "$RUNNER_TEMP/artifact.tgz" -C "@@BUILD_DIR@@" .
              ;;
            docker-compose)
              tar -czf "$RUNNER_TEMP/artifact.tgz" -C "@@COMPOSE_DIR@@" .
              ;;
            *)
              echo "Unknown artifact type: @@ARTIFACT_TYPE@@" >&2
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "artifact-${{ github.sha }}"
          path: ${{ runner.temp }}/artifact.tgz
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: package
    if: github.repository == '@@REPO@@' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PD_AUTO_DEPLOY == 'true')
    runs-on: [self-hosted, linux, x64, '@@RUNNER_LABEL@@']
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: "artifact-${{ github.sha }}"
          path: ${{ runner.temp }}/pd-artifact
      - name: Publish immutable release
        shell: bash
        env:
          PD_SHA: ${{ github.sha }}
          PD_SITE_URL: ${{ vars.PD_SITE_URL }}
        run: |
          set -euo pipefail
          /usr/bin/python3 /usr/local/libexec/portico-deploy-release.py --project '@@PROJECT@@' --sha "$PD_SHA" --archive "$RUNNER_TEMP/pd-artifact/@@ARTIFACT_ARCHIVE@@"
          /usr/bin/bash /usr/local/libexec/portico-deploy-verify.sh '@@PROJECT@@' "$PD_SHA" "${PD_SITE_URL:-}"