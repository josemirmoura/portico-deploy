name: Portico Deploy | CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Python
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
      - name: Validate shell
        run: |
          bash -n scripts/*.sh tests/*.sh
          bash tests/test_setup_plan.sh
          bash tests/test_setup_apply.sh
          bash tests/test_setup_apply_success.sh
          sudo bash tests/test_provision_checksum.sh

  m1-disposable-host:
    name: M1 | real Linux accounts and cross-job artifact
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create static test artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          printf 'portico-disposable-v1\n' > "$RUNNER_TEMP/site/index.html"
          tar -czf "$RUNNER_TEMP/site-v1.tgz" -C "$RUNNER_TEMP/site" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portico-m1-site
          path: ${{ runner.temp }}/site-v1.tgz
          if-no-files-found: error
          retention-days: 1
  m1-disposable-deploy:
    name: M1 | deploy and rollback on disposable Ubuntu
    needs: m1-disposable-host
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portico-m1-site
          path: ${{ runner.temp }}/m1-download
      - name: Run real Linux user and HTTP isolation checks
        env:
          M1_ARCHIVE: ${{ runner.temp }}/m1-download/site-v1.tgz
        run: sudo --preserve-env=M1_ARCHIVE bash tests/test_linux_host_lab.sh
